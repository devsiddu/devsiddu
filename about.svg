<text class="lab" x="32" y="58">A LITTLE CONTEXT</text><text class="h" x="32" y="92">About Me</text><text class="b" x="280" y="62">I&#x27;m a Software Engineer focused on building reliable, scalable</text><text class="b" x="280" y="84">web and business applications. I have hands-on experience</text><text class="b" x="280" y="106">across frontend, backend, databases, and application</text><text class="b" x="280" y="128">development, working with Java, PHP, React, MERN, SQL Server,</text><text class="b" x="280" y="150">MySQL, and React Native.</text><text class="b" x="280" y="182">I enjoy turning real-world requirements into practical software</text><text class="b" x="280" y="204">— from database-driven systems and APIs to responsive</text><text class="b" x="280" y="226">interfaces and business workflows.</text><rect x="280" y="256" width="156" height="26" rx="3" fill="none" stroke="#262b2b"/><text class="ct" x="358.0" y="273" text-anchor="middle">Software Engineering</text><rect x="446.0" y="256" width="169" height="26" rx="3" fill="none" stroke="#262b2b"/><text class="ct" x="530.7" y="273" text-anchor="middle">Full-Stack Development</text><rect x="280" y="290" width="176" height="26" rx="3" fill="none" stroke="#262b2b"/><text class="ct" x="368.1" y="307" text-anchor="middle">Enterprise Applications</text><rect x="466.1" y="290" width="129" height="26" rx="3" fill="none" stroke="#262b2b"/><text class="ct" x="530.7" y="307" text-anchor="middle">Database Systems</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>