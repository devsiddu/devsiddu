  <defs>
    <style>
      .name { font-family: ui-serif, Georgia, "Times New Roman", serif; font-weight: 500; letter-spacing: -0.02em; fill: #f0f6fc; }
      .role { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 400; letter-spacing: 0.02em; fill: #8b949e; }
      .mark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 400; letter-spacing: 0.18em; fill: #6e7681; text-transform: uppercase; }
    </style>
  </defs>
 
  <!-- Background -->
  <rect width="1280" height="320" fill="#0D1117"/>

