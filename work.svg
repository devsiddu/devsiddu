<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-label="Selected work: GEPMS, Smart Attendance and Payroll, Farmers Cafe" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t { fill: #e6edf3; font-size: 15px; font-weight: 700; }
    .d { fill: #8b949e; font-size: 11.5px; }
    .tag { font-size: 11px; font-weight: 700; }
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .c1 { animation: glow 6s ease-in-out infinite; }
    .c2 { animation: glow 6s ease-in-out 2s infinite; }
    .c3 { animation: glow 6s ease-in-out 4s infinite; }
    @keyframes glow { 0%,100% { stroke: #30363d; } 50% { stroke: #58a6ff; } }
  </style>

  <rect class="card c1" x="1" y="1" width="254" height="168" rx="10"/>
  <rect x="1" y="1" width="254" height="5" rx="2" fill="#3fb950"/>
  <text x="20" y="38" class="tag" fill="#3fb950">● PRODUCTION</text>
  <text x="20" y="66" class="t">GEPMS</text>
  <text x="20" y="92" class="d">Power generation and sales</text>
  <text x="20" y="108" class="d">entry/management system for</text>
  <text x="20" y="124" class="d">Gokak Textiles. In daily use.</text>
  <text x="20" y="152" class="tag" fill="#58a6ff">PHP · SQL Server</text>

  <rect class="card c2" x="273" y="1" width="254" height="168" rx="10"/>
  <rect x="273" y="1" width="254" height="5" rx="2" fill="#58a6ff"/>
  <text x="292" y="38" class="tag" fill="#58a6ff">◆ OPEN SOURCE</text>
  <text x="292" y="66" class="t">Smart Attendance</text>
  <text x="292" y="92" class="d">PHP-based attendance system</text>
  <text x="292" y="108" class="d">with integrated payroll.</text>
  <text x="292" y="152" class="tag" fill="#58a6ff">PHP · github/devsiddu</text>

  <rect class="card c3" x="545" y="1" width="254" height="168" rx="10"/>
  <rect x="545" y="1" width="254" height="5" rx="2" fill="#d29922"/>
  <text x="564" y="38" class="tag" fill="#d29922">▲ E-COMMERCE</text>
  <text x="564" y="66" class="t">Farmers Cafe</text>
  <text x="564" y="92" class="d">Agricultural marketplace with</text>
  <text x="564" y="108" class="d">shop switching, product mgmt</text>
  <text x="564" y="124" class="d">and approval workflows.</text>
  <text x="564" y="152" class="tag" fill="#58a6ff">React · TypeScript · Tailwind</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
